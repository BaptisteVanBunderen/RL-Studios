<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Précision</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <div class="panel">
      <div class="table" style="--cols: 3">
        <span></span>
        <span class="head">Tirs</span>
        <span class="head">Buts</span>
        <span class="head">Réussite</span>
        <div class="group">
          <span class="name">Match</span>
          <b id="m-shots" class="num">0</b>
          <b id="m-goals" class="num good">0</b>
          <b id="m-acc" class="num">–</b>
        </div>
        <div class="group" id="session-row">
          <span class="name">Session</span>
          <b id="s-shots" class="num">0</b>
          <b id="s-goals" class="num good">0</b>
          <b id="s-acc" class="num">–</b>
        </div>
      </div>
    </div>

    <script src="/sdk/rlstudio.js"></script>
    <script src="common.js"></script>
    <script>
      var settings = { showSession: true, bgOpacity: 0.88 }
      var match = null
      var session = null

      function byId(id) {
        return document.getElementById(id)
      }

      function render() {
        byId('session-row').hidden = !settings.showSession
        var m = Stats.matchStats(match)
        Stats.setText(byId('m-shots'), m.shots)
        Stats.setText(byId('m-goals'), m.goals)
        Stats.setText(byId('m-acc'), Stats.accuracy(m.goals, m.shots))
        if (!session) return
        var s = Stats.sessionStats(session)
        Stats.setText(byId('s-shots'), s.shots)
        Stats.setText(byId('s-goals'), s.goals)
        Stats.setText(byId('s-acc'), Stats.accuracy(s.goals, s.shots))
      }

      RLStudio.on('settings', function (values) {
        settings = values
        document.documentElement.style.setProperty('--bg-opacity', values.bgOpacity)
        render()
      })
      RLStudio.on('match', function (m) {
        match = m
        render()
      })
      RLStudio.on('session', function (s) {
        session = s
        render()
      })
    </script>
  </body>
</html>

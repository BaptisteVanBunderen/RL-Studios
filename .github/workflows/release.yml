name: Release

# Une release = un tag vX.Y.Z posé sur un commit de main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Installeur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Le tag doit être sur main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Le tag $GITHUB_REF_NAME n'est pas sur main."; exit 1; }

      - name: Le tag doit correspondre à la version de package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME, mais package.json est en $version."; exit 1; }

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:win

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true

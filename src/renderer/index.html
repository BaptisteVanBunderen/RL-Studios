<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RL Studio</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         Le client n'ouvre aucune connexion réseau. Seules exceptions, vers le serveur local
         d'overlays (127.0.0.1) : l'aperçu en direct (iframe) et les images d'aperçu des packs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:*; frame-src http://127.0.0.1:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
